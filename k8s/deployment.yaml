apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquiforge
  labels:
    app: liquiforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liquiforge
  template:
    metadata:
      labels:
        app: liquiforge
    spec:
      containers:
        - name: liquiforge
          image: liquiforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          command: ["liquiforge", "serve", "--host", "0.0.0.0", "--port", "8787"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
